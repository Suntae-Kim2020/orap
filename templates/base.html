<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Publication Database{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .lang-selector {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .lang-selector:hover {
            border-color: rgba(255,255,255,0.6);
        }
        .lang-selector option {
            background: #343a40;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('researcher_ranking') }}">
                <i class="fas fa-graduation-cap"></i> <span data-i18n="nav.brand">JBNU ORAP</span>
            </a>
            <div class="navbar-nav me-auto">
                <!-- 숨김 처리: 홈, 분석방관리, 분석, 도움말 메뉴
                <a class="nav-link" href="{{ url_for('index') }}">
                    <i class="fas fa-home"></i> Home
                </a>
                <a class="nav-link" href="{{ url_for('manage_rooms') }}">
                    <i class="fas fa-plus-circle"></i> 분석방 관리
                </a>
                <a class="nav-link" href="{{ url_for('analysis') }}">
                    <i class="fas fa-chart-bar"></i> 분석
                </a>
                -->
                <a class="nav-link" href="{{ url_for('researcher_ranking') }}">
                    <i class="fas fa-trophy"></i> <span data-i18n="nav.researcher_ranking">연구자 랭킹</span>
                </a>
                <a class="nav-link" href="{{ url_for('analysis_modules') }}">
                    <i class="fas fa-microscope"></i> <span data-i18n="nav.analysis_modules">분석 모듈</span>
                </a>
                <a class="nav-link" href="{{ url_for('research_strategy') }}">
                    <i class="fas fa-chess-knight"></i> <span data-i18n="nav.research_strategy">연구 전략</span>
                </a>
                <a class="nav-link" href="{{ url_for('field_analysis') }}">
                    <i class="fas fa-layer-group"></i> <span data-i18n="nav.field_analysis">학문분야분석</span>
                </a>
                <a class="nav-link" href="{{ url_for('survey') }}">
                    <i class="fas fa-clipboard-list"></i> <span data-i18n="nav.survey">설문참여</span>
                </a>
                <!-- 숨김 처리: 도움말 메뉴
                <div class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="helpDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="fas fa-question-circle"></i> 도움말
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="helpDropdown">
                        <li><a class="dropdown-item" href="{{ url_for('help_stage1') }}">
                            <i class="fas fa-info-circle"></i> 우수논문 1단계 후보추출방법
                        </a></li>
                        <li><a class="dropdown-item" href="{{ url_for('help_stage2') }}">
                            <i class="fas fa-info-circle"></i> 우수논문 2단계 후보추출방법
                        </a></li>
                    </ul>
                </div>
                -->
            </div>
            <!-- 언어 선택 -->
            <div class="d-flex align-items-center">
                <i class="fas fa-globe text-light me-2"></i>
                <select id="language-selector" class="lang-selector" onchange="i18n.setLanguage(this.value)">
                    <option value="ko">한국어</option>
                    <option value="en">English</option>
                </select>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
